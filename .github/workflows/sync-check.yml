name: 上游同步检查

on:
  schedule:
    - cron: "23 3 * * *" # 每日一次（GitHub 会在仓库 60 天无活动后停用定时任务，届时手动 workflow_dispatch 一次即可恢复）
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-sync-check
  cancel-in-progress: false

env:
  UPSTREAM_REPO: 0xNyk/awesome-hermes-agent
  WATCH_FILES: "^README\\.md$|^CONTRIBUTING\\.md$|^CHANGELOG\\.md$|^LICENSE$"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      needs_sync: ${{ steps.check.outputs.needs_sync }}
      upstream_head: ${{ steps.check.outputs.upstream_head }}
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4

      - name: 比对上游更新
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST="$(cat .github/upstream-sync-ref 2>/dev/null || echo '')"
          HEAD_SHA="$(gh api "repos/${UPSTREAM_REPO}/commits/main" --jq .sha)"
          echo "upstream_head=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

          ensure_git_user() {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          }

          record_baseline() {
            echo "$HEAD_SHA" > .github/upstream-sync-ref
            ensure_git_user
            git add .github/upstream-sync-ref
            git commit -m "chore: 推进上游基线 ${HEAD_SHA:0:7} ($1)"
            git push
          }

          if [ -z "$LAST" ]; then
            record_baseline "首次运行记录基线"
            exit 0
          fi

          if [ "$LAST" = "$HEAD_SHA" ]; then
            echo "上游无更新（${HEAD_SHA:0:7}）"
            exit 0
          fi

          gh api "repos/${UPSTREAM_REPO}/compare/${LAST}...${HEAD_SHA}" --jq '.files[].filename' > changed.txt
          echo "上游变更文件："
          cat changed.txt

          if ! grep -Eq "$WATCH_FILES" changed.txt; then
            record_baseline "关注文件无变化"
            exit 0
          fi

          OPEN_NUM=$(gh issue list --label sync --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$OPEN_NUM" ]; then
            echo "已存在待同步 issue #$OPEN_NUM，复用它重试翻译"
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=${OPEN_NUM}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needs_sync=true" >> "$GITHUB_OUTPUT"

      - name: 创建同步任务 issue
        id: create_issue
        if: steps.check.outputs.needs_sync == 'true' && steps.check.outputs.issue_number == ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.check.outputs.upstream_head }}
        run: |
          set -euo pipefail
          gh label create sync --color 1D76DB --description "上游同步任务" 2>/dev/null || true

          LOG=$(gh api "repos/${UPSTREAM_REPO}/commits?sha=main&per_page=15" \
            --jq '.[] | "- \(.sha[0:7]) \(.commit.message | split("\n")[0])"')

          BODY=$(cat <<EOF
          ## 上游更新检测

          - 上游仓库：${UPSTREAM_REPO}
          - 目标 SHA：\`${HEAD_SHA}\`
          - 关注文件（README / CONTRIBUTING / CHANGELOG / LICENSE）发生变化

          ### 上游最近提交
          ${LOG}

          ### 处理方式

          OpenAI 自动翻译流水线已启动：翻译通过结构校验后会**直接合入 main** 并自动关闭本 issue；失败时会在本 issue 评论并转人工处理。
          EOF
          )

          URL=$(gh issue create --title "上游有更新，待同步至 ${HEAD_SHA:0:7}" --label sync --body "$BODY")
          NUM="${URL##*/}"
          echo "issue_number=${NUM}" >> "$GITHUB_OUTPUT"
          echo "已创建同步 issue #$NUM: $URL"

  translate:
    needs: check
    if: needs.check.outputs.needs_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 拉取上游源文件
        uses: actions/checkout@v4
        with:
          repository: 0xNyk/awesome-hermes-agent
          ref: ${{ needs.check.outputs.upstream_head }}
          path: upstream-src

      - name: 生成旧版快照
        run: git show HEAD:README.md > /tmp/README.old

      - name: OpenAI 翻译
        env:
          # 配置路径（Secret/Variable 的设置位置与排障）见 .github/AUTOMATION.md
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE: ${{ vars.OPENAI_BASE }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_MAX_TOKENS: ${{ vars.OPENAI_MAX_TOKENS }}
        run: |
          set -euo pipefail
          python3 .github/scripts/run_sync_translation.py \
            --upstream upstream-src/README.md \
            --current README.md \
            --agents AGENTS.md \
            --out /tmp/README.new
          cp /tmp/README.new README.md

          # 复制新引用且本地缺失的图片
          for img in $(grep -oE 'assets/[^") ]+' README.md | sort -u); do
            if [ ! -f "$img" ]; then
              mkdir -p "$(dirname "$img")"
              cp "upstream-src/$img" "$img" && echo "已复制图片 $img" \
                || echo "::warning::缺失图片 $img（上游源中也不存在）"
            fi
          done

      - name: 结构校验（质量闸门）
        run: |
          set -o pipefail
          python3 .github/scripts/validate_sync.py \
            --upstream upstream-src/README.md \
            --candidate README.md \
            --current /tmp/README.old \
            --repo-root . | tee /tmp/validation.md

      - name: 直接合入 main 并关闭 issue
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.check.outputs.upstream_head }}
          ISSUE: ${{ needs.check.outputs.issue_number }}
        run: |
          set -euo pipefail
          rm -rf upstream-src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$HEAD_SHA" > .github/upstream-sync-ref
          git add -A
          git commit -m "sync: 上游 ${HEAD_SHA:0:7} 翻译同步（AI 自动，已通过结构校验）"
          # 兜底：运行期间若有人推送了 main，rebase 后再推
          git pull --rebase origin main
          git push origin main
          COMMIT=$(git rev-parse --short HEAD)
          {
            echo "✅ 自动翻译完成、通过结构校验，已直接合入 main（commit ${COMMIT}），上游基线推进至 \`${HEAD_SHA:0:7}\`。"
            echo
            echo "<details><summary>校验报告</summary>"
            echo
            cat /tmp/validation.md
            echo
            echo "</details>"
            echo
            echo "> 如对翻译质量有异议，revert 该 commit 即可，基线不会回退、不影响下次同步。"
          } > /tmp/done.md
          gh issue close "$ISSUE" --reason completed --comment-file /tmp/done.md
          echo "已合入 main 并关闭 issue #$ISSUE"

      - name: 失败时通知人工处理
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.check.outputs.issue_number }}
        run: |
          gh issue comment "${ISSUE:-}" --body "⚠️ 自动翻译或校验失败，请按 \`AGENTS.md\` 的「上游同步流程」人工同步本仓库。" \
            || echo "::warning::翻译失败且未能评论 issue"

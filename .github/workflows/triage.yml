name: 自动核验 issue 与 PR

on:
  issues:
    types: [opened, reopened]
  # 注意：必须用 pull_request_target（以 main 上的 workflow + base 分支代码运行），
  # 否则 fork PR 会被首次贡献者审批门拦截（action_required），且 GITHUB_TOKEN 只读、无 secrets。
  # 安全红线见 lint-pr job 内注释：PR 内容只作为数据，绝不 checkout / 执行 PR 分支代码。
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      kind:
        description: "核验对象类型"
        required: true
        default: "issue"
        type: choice
        options: [issue, pr]
      number:
        description: "issue / PR 编号"
        required: true
        default: ""

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  triage-issue:
    if: github.event_name == 'issues' || (github.event_name == 'workflow_dispatch' && inputs.kind == 'issue')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 核验推荐资源并起草条目
        env:
          GH_TOKEN: ${{ github.token }}
          # OPENAI_API_KEY 配置路径见 .github/AUTOMATION.md
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE: ${{ vars.OPENAI_BASE }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_MAX_TOKENS: ${{ vars.OPENAI_MAX_TOKENS }}
          ISSUE: ${{ github.event.issue.number || inputs.number }}
          TITLE: ${{ github.event.issue.title || '' }}
        run: |
          set -euo pipefail
          gh label create resource-recommendation --color 0E8A16 --description "资源推荐" 2>/dev/null || true
          gh label create "triage:pass" --color 0E8A16 --description "自动核验通过" 2>/dev/null || true
          gh label create "triage:fail" --color D93F0B --description "自动核验未通过" 2>/dev/null || true

          LABELS="$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | join(" ")')"
          if [[ "$LABELS" == *"sync"* ]]; then
            echo "同步任务 issue，跳过核验"
            exit 0
          fi

          gh issue view "$ISSUE" --json title,body --jq '"\(.title)\n\n\(.body)"' > /tmp/issue.txt
          if ! python3 .github/scripts/verify_resources.py /tmp/issue.txt README.md > /tmp/report.md; then
            VERDICT="fail"
          else
            VERDICT="pass"
          fi
          echo "核验结果: $VERDICT"

          {
            echo "### 🤖 自动核验报告"
            echo
            cat /tmp/report.md
            if [ "$VERDICT" = "pass" ]; then
              echo
              echo "---"
              echo "✅ 基础核验通过（存在、未归档、非 fork、有许可证、未重复收录）。已加 \`resource-recommendation\` 标签，正在起草并自动收录。"
            else
              echo
              echo "---"
              echo "❌ 自动核验未通过，不收录。如有异议（例如许可证即将补充、收录标准变化），请评论或重开 issue 由维护者人工复核。"
            fi
          } > /tmp/comment.md

          if [ "$VERDICT" = "pass" ]; then
            FIRST_REPO="$(grep -Eo 'github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' /tmp/issue.txt | head -1 | sed 's#github\.com/##')"
            if [ -n "$FIRST_REPO" ] && python3 .github/scripts/draft_entry.py --repo "$FIRST_REPO" --issue-title "$TITLE" --out /tmp/draft.json 2>/tmp/draft_err.log; then
              ENTRY="$(python3 -I -c "import json; print(json.load(open('/tmp/draft.json'))['entry'])")"
              SECTION="$(python3 -I -c "import json; print(json.load(open('/tmp/draft.json'))['section'])")"
              if python3 .github/scripts/insert_entry.py --anchor "$SECTION" --repo "$FIRST_REPO" --line "$ENTRY"; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add README.md .github/local-entries.txt
                git commit -m "docs: 收录 ${FIRST_REPO}（AI 自动，来自 issue #${ISSUE}）"
                git push origin main
                COMMIT=$(git rev-parse --short HEAD)
                {
                  echo
                  echo "---"
                  echo "### ✅ 已自动收录"
                  echo
                  echo "- 分区：\`${SECTION}\`"
                  echo "- 条目："
                  echo "  \`\`\`"
                  echo "  ${ENTRY}"
                  echo "  \`\`\`"
                  echo "- commit：${COMMIT}（如对分类/描述/标签有异议，直接修改该行或 revert 即可）"
                } >> /tmp/comment.md
                gh issue comment "$ISSUE" --body-file /tmp/comment.md
                gh issue close "$ISSUE" --reason completed
                exit 0
              fi
            fi
            # 起草或插入失败：转人工
            {
              echo
              echo "---"
              echo "⚠️ AI 起草或插入收录条目失败（$(tail -1 /tmp/draft_err.log 2>/dev/null || echo '未知原因')），请维护者人工收录。"
            } >> /tmp/comment.md
            gh issue comment "$ISSUE" --body-file /tmp/comment.md
            gh issue edit "$ISSUE" --add-label "resource-recommendation,triage:pass"
            exit 0
          fi

          # 不通过：附理由自动关闭
          gh issue comment "$ISSUE" --body-file /tmp/comment.md
          gh issue edit "$ISSUE" --add-label "triage:fail"
          gh issue close "$ISSUE" --reason "not planned" || true

  lint-pr:
    if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.kind == 'pr')
    concurrency:
      group: triage-pr-${{ github.event.pull_request.number || inputs.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # pull_request_target 事件下默认 checkout 的是 base 分支（可信代码）。
      # 安全红线：本 job 的任何步骤都不得 checkout / 执行 PR 分支的代码；
      # PR 内容（diff、正文）只作为数据传给校验与评审脚本。
      - uses: actions/checkout@v4

      - name: 硬门槛核验 + AI 评审 + 自动处置
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE: ${{ vars.OPENAI_BASE }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_MAX_TOKENS: ${{ vars.OPENAI_MAX_TOKENS }}
          AUTO_MERGE_DAILY_CAP: ${{ vars.AUTO_MERGE_DAILY_CAP }}
          PR: ${{ github.event.pull_request.number || inputs.number }}
          TITLE: ${{ github.event.pull_request.title || '' }}
          AUTHOR: ${{ github.event.pull_request.user.login || '' }}
        run: |
          set -euo pipefail
          gh label create "format:ok" --color 0E8A16 --description "PR 格式核验通过" 2>/dev/null || true
          gh label create "format:issues" --color D93F0B --description "PR 格式核验发现问题" 2>/dev/null || true
          gh label create "triage:fail" --color D93F0B --description "自动核验未通过" 2>/dev/null || true
          gh label create "needs-human" --color FBCA04 --description "需人工复核" 2>/dev/null || true

          FILES="$(gh pr view "$PR" --json files --jq '.files[].path' | tr '\n' ' ')"
          echo "变更文件: $FILES"
          gh pr diff "$PR" > /tmp/pr.diff
          gh pr view "$PR" --json title,body --jq '"\(.title)\n\n\(.body // "")"' > /tmp/pr.txt

          # ---------- 第 0 层：确定性硬门槛（不信任 PR 文本，也不信任 AI） ----------
          if ! python3 .github/scripts/lint_pr_entries.py /tmp/pr.diff README.md "$FILES" > /tmp/report.md; then
            {
              echo "### 🤖 PR 自动核验"
              echo
              cat /tmp/report.md
              echo
              echo "---"
              echo "❌ 未通过格式硬门槛（只允许改动 README.md 并追加/修正符合格式的条目行）。请修正后重新打开 PR，机器人会自动重新评审。"
            } > /tmp/comment.md
            gh pr comment "$PR" --body-file /tmp/comment.md
            gh pr edit "$PR" --add-label "format:issues" || true
            gh pr close "$PR" || true
            exit 0
          fi

          GATE="$(python3 .github/scripts/gate_pr_added.py --json /tmp/gate.json /tmp/pr.diff README.md)" && GATE_RC=0 || GATE_RC=$?
          echo "硬门槛结果: rc=$GATE_RC"
          if [ "$GATE_RC" -eq 1 ]; then
            {
              echo "### 🤖 PR 自动核验"
              echo
              cat /tmp/report.md
              echo
              echo "---"
              echo "❌ 未通过自动合并硬门槛："
              echo
              echo "$GATE"
              echo
              echo "请修正后重新打开 PR，机器人会自动重新评审。"
            } > /tmp/comment.md
            gh pr comment "$PR" --body-file /tmp/comment.md
            gh pr edit "$PR" --add-label "format:issues" || true
            gh pr close "$PR" || true
            exit 0
          fi
          if [ "$GATE_RC" -ne 0 ]; then
            {
              echo "### 🤖 PR 自动核验"
              echo
              cat /tmp/report.md
              echo
              echo "---"
              echo "⚠️ 满足基础格式要求，但触发了人工复核规则："
              echo
              echo "$GATE"
            } > /tmp/comment.md
            gh pr comment "$PR" --body-file /tmp/comment.md
            gh pr edit "$PR" --add-label "needs-human" || true
            exit 0
          fi

          # ---------- 第 1 层：AI 对照起草 + 内容评审 ----------
          FIRST_REPO="$(python3 -I -c "import json;d=json.load(open('/tmp/gate.json'));print(d['repos'][0] if d['repos'] else '')")"
          DRAFT_FILE=""
          if [ -n "$FIRST_REPO" ]; then
            if python3 .github/scripts/draft_entry.py --repo "$FIRST_REPO" --issue-title "$TITLE" --out /tmp/draft.json; then
              DRAFT_FILE="/tmp/draft.json"
            fi
          fi

          if ! python3 .github/scripts/review_pr.py --pr-title "$TITLE" --author "$AUTHOR" \
              --body-file /tmp/pr.txt --diff-file /tmp/pr.diff --lint-report-file /tmp/report.md \
              --draft-file "$DRAFT_FILE" --repo "$FIRST_REPO" --out /tmp/verdict.json; then
            {
              echo "### 🤖 PR 自动核验"
              echo
              cat /tmp/report.md
              echo
              echo "---"
              echo "⚠️ AI 评审调用失败，已标记 needs-human，请维护者人工复核。"
            } > /tmp/comment.md
            gh pr comment "$PR" --body-file /tmp/comment.md
            gh pr edit "$PR" --add-label "needs-human" || true
            exit 0
          fi

          VERDICT="$(python3 -I -c "import json;print(json.load(open('/tmp/verdict.json'))['verdict'])")"
          echo "AI 评审: $VERDICT"

          python3 -I -c "import json; report=open('/tmp/report.md',encoding='utf-8').read().strip(); reason=json.load(open('/tmp/verdict.json',encoding='utf-8'))['reason'].strip(); print('### 🤖 PR 自动核验'); print(); print(report); print(); print('---'); print(); print(reason)" > /tmp/base.md

          # ---------- 第 2 层：按结论处置（含每日自动合并上限与草稿保护） ----------
          CAP="${AUTO_MERGE_DAILY_CAP:-10}"
          TODAY="$(date -u +%Y-%m-%dT00:00:00Z)"
          MERGED_TODAY="$(gh pr list --state merged --limit 50 --json mergedAt | jq --arg t "$TODAY" '[.[] | select(.mergedAt >= $t)] | length' 2>/dev/null || echo 0)"
          echo "今日已自动/人工合并 PR 数: $MERGED_TODAY（上限 $CAP）"
          IS_DRAFT="$(gh pr view "$PR" --json isDraft --jq .isDraft 2>/dev/null || echo false)"

          if [ "$VERDICT" = "pass" ] && [ "$IS_DRAFT" != "true" ] && [ "${MERGED_TODAY:-0}" -lt "$CAP" ]; then
            if gh pr merge "$PR" --squash; then
              MSHA="$(gh pr view "$PR" --json mergeCommit --jq .mergeCommit.oid 2>/dev/null || true)"
              EXTRA=""
              [ -n "$MSHA" ] && EXTRA="（commit ${MSHA:0:7}）"
              {
                cat /tmp/base.md
                echo
                echo "---"
                echo "✅ AI 评审通过，已自动 squash 合并${EXTRA}。如对条目内容有异议，直接修改对应行即可。"
              } > /tmp/final.md
              gh pr comment "$PR" --body-file /tmp/final.md
              gh pr edit "$PR" --add-label "format:ok" || true
            else
              {
                cat /tmp/base.md
                echo
                echo "---"
                echo "⚠️ 评审通过但自动合并失败（可能存在冲突或分支状态变化），已标记 needs-human 转人工。"
              } > /tmp/final.md
              gh pr comment "$PR" --body-file /tmp/final.md
              gh pr edit "$PR" --add-label "needs-human" || true
            fi
          elif [ "$VERDICT" = "pass" ]; then
            {
              cat /tmp/base.md
              echo
              echo "---"
              echo "⚠️ 评审通过，但已达每日自动合并上限（${CAP}）或 PR 为草稿，转人工处理。"
            } > /tmp/final.md
            gh pr comment "$PR" --body-file /tmp/final.md
            gh pr edit "$PR" --add-label "needs-human" || true
          elif [ "$VERDICT" = "fail" ]; then
            {
              cat /tmp/base.md
              echo
              echo "---"
              echo "❌ AI 评审未通过，已自动关闭。如有异议可重开 PR 并补充说明，机器人会重新评审。"
            } > /tmp/final.md
            gh pr comment "$PR" --body-file /tmp/final.md
            gh pr edit "$PR" --add-label "triage:fail" || true
            gh pr close "$PR" || true
          else
            {
              cat /tmp/base.md
              echo
              echo "---"
              echo "⚠️ AI 评审结论为「不确定」，保持打开并标记 needs-human，等待维护者复核。"
            } > /tmp/final.md
            gh pr comment "$PR" --body-file /tmp/final.md
            gh pr edit "$PR" --add-label "needs-human" || true
          fi
